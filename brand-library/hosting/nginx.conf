server {
    listen 8080;
    server_name _;
    root /srv/openline;
    index index.html;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    # Large review archives are already versioned in the same public repository.
    # Pin their redirects to the same immutable commit as this deployment.
    location = /downloads/openline-five-series.zip { return 302 https://openline-brand.fly.dev/downloads/openline-orange-series.zip; }
    location = /downloads/openline-five-series-sources.zip { return 302 https://openline-brand.fly.dev/downloads/openline-orange-series-sources.zip; }
    location ~ ^/downloads/(openline-(orange-series|series-signal|all-resources)\.zip)$ {
        return 302 https://raw.githubusercontent.com/paulfxyz/openline-brand-assets/__SOURCE_COMMIT__/launch-studio/public/downloads/$1;
    }
    location /downloads/ {
        try_files $uri =404;
        expires -1;
    }
    location /assets/ {
        try_files $uri =404;
        expires 5m;
    }
    location /series/ {
        try_files $uri =404;
        expires -1;
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
